name: Windows

on:
  push:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  package-warmup:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5
    - name: Restore LLVM package cache
      id: llvm-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/llvm
          _Build/_Packages/llvm_*
        key: sc-packages-windows-llvm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-windows-llvm-v4-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-windows-llvm-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-windows-llvm-v2-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux glibc arm64 sysroot cache
      id: linux_sysroot_glibc_arm64_cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-arm64
          _Build/_PackagesCache/linux-sysroot/glibc-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-arm64
          _Build/_Packages/linux-sysroot_glibc_arm64
        key: sc-packages-windows-linux-sysroot-glibc-arm64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-windows-linux-sysroot-glibc-arm64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux musl x86_64 sysroot cache
      id: linux_sysroot_musl_x64_cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-x86_64
          _Build/_PackagesCache/linux-sysroot/musl-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-x86_64
          _Build/_Packages/linux-sysroot_musl_x86_64
        key: sc-packages-windows-linux-sysroot-musl-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-windows-linux-sysroot-musl-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Check restored Linux sysroots
      id: linux_sysroots
      shell: bash
      run: |
        set -euo pipefail
        if [[ -f "_Build/_Packages/linux-sysroot_glibc_arm64/sc-package-receipt.json" ]]; then
          echo "glibc-arm64-installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "glibc-arm64-installed=false" >> "$GITHUB_OUTPUT"
        fi
        if [[ -f "_Build/_Packages/linux-sysroot_musl_x86_64/sc-package-receipt.json" ]]; then
          echo "musl-x86_64-installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "musl-x86_64-installed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Initialize MSVC environment
      shell: pwsh
      run: ./Support/Scripts/InitializeMsvcEnvironment.ps1
    - name: Warm packaged LLVM toolchain
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: cmd
      run: |
        call SC.bat package install llvm
    - name: Warm packaged Linux glibc arm64 sysroot
      if: steps.linux_sysroots.outputs.glibc-arm64-installed != 'true'
      shell: cmd
      run: |
        call SC.bat package install linux-sysroot-glibc-arm64
    - name: Warm packaged Linux musl x86_64 sysroot
      if: steps.linux_sysroots.outputs.musl-x86_64-installed != 'true'
      shell: cmd
      run: |
        call SC.bat package install linux-sysroot-musl-x86_64
    - name: Prune LLVM package cache
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: ./Support/Scripts/PruneLLVMPackageCache.sh .
    - name: Verify warmed package receipts
      shell: cmd
      run: |
        call SC.bat package verify llvm
        call SC.bat package verify linux-sysroot-glibc-arm64
        call SC.bat package verify linux-sysroot-musl-x86_64
        call SC.bat package lock
    - name: Save LLVM package cache
      if: always() && steps.llvm-cache.outputs.cache-hit != 'true' && hashFiles('_Build/_PackagesCache/llvm/**') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/llvm
          _Build/_Packages/llvm_*
        key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
    - name: Save Linux glibc arm64 sysroot cache
      if: always() && steps.linux_sysroot_glibc_arm64_cache.outputs.cache-hit != 'true' && hashFiles('_Build/_Packages/linux-sysroot_glibc_arm64/sc-package-receipt.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-arm64
          _Build/_PackagesCache/linux-sysroot/glibc-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-arm64
          _Build/_Packages/linux-sysroot_glibc_arm64
        key: ${{ steps.linux_sysroot_glibc_arm64_cache.outputs.cache-primary-key }}
    - name: Save Linux musl x86_64 sysroot cache
      if: always() && steps.linux_sysroot_musl_x64_cache.outputs.cache-hit != 'true' && hashFiles('_Build/_Packages/linux-sysroot_musl_x86_64/sc-package-receipt.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-x86_64
          _Build/_PackagesCache/linux-sysroot/musl-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-x86_64
          _Build/_Packages/linux-sysroot_musl_x86_64
        key: ${{ steps.linux_sysroot_musl_x64_cache.outputs.cache-primary-key }}

  core:
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
        params: [ { os: windows-2022, generator: vs2022 },
                  { os: windows-2025, generator: vs2022 } ]
    runs-on: ${{ matrix.params.os }}
    timeout-minutes: 12
    env:
      WINDOWS_LONG_PATH_ARGS: ${{ matrix.config == 'Debug' && matrix.params.os == 'windows-2022' && '--windows-long-path-aware off' || '' }}

    steps:
    - uses: actions/checkout@v5
    - name: Verify OpenSSL 3
      shell: pwsh
      run: |
        $gitDirectory = Split-Path (Get-Command git.exe -ErrorAction Stop).Source
        $gitRoot = $gitDirectory
        while ($gitRoot -and -not (Test-Path (Join-Path $gitRoot 'git-bash.exe'))) {
          $gitRoot = Split-Path $gitRoot -Parent
        }
        if (-not $gitRoot) {
          throw "The Git for Windows installation root was not found"
        }

        $openSSLDll = $null
        foreach ($runtime in @('ucrt64', 'mingw64')) {
          $candidate = Join-Path $gitRoot "$runtime\bin\libcrypto-3-x64.dll"
          if (Test-Path $candidate) {
            $openSSLDll = $candidate
            break
          }
        }
        if (-not $openSSLDll) {
          throw "The Git for Windows OpenSSL runtime was not found under $gitRoot"
        }
        $openSSLExe = Join-Path (Split-Path $openSSLDll) 'openssl.exe'
        if (-not (Test-Path $openSSLExe)) {
          $openSSLExe = Join-Path $gitRoot 'usr\bin\openssl.exe'
        }
        if (-not (Test-Path $openSSLExe)) {
          throw "The Git for Windows OpenSSL executable was not found under $gitRoot"
        }

        $version = & $openSSLExe version
        if ($LASTEXITCODE -ne 0 -or $version -notmatch '^OpenSSL 3\.') {
          throw "OpenSSL 3 is required, found: $version"
        }
        Write-Output $version
        Write-Output "OpenSSL runtime: $openSSLDll"
        "SC_OPENSSL_DLL=$openSSLDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Initialize MSVC environment
      shell: pwsh
      run: ./Support/Scripts/InitializeMsvcEnvironment.ps1
    - name: configure SCTest
      shell: cmd
      run: SC.bat build configure SCTest ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%
    - name: compile SCTest
      shell: cmd
      run: SC.bat build compile SCTest ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%
    - name: Stage OpenSSL 3 runtime
      shell: pwsh
      run: |
        $openSSLDll = $env:SC_OPENSSL_DLL
        if (-not $openSSLDll -or -not (Test-Path $openSSLDll)) {
          throw "The verified OpenSSL runtime was not found"
        }

        $scTest = Get-ChildItem "_Build/_Outputs" -Filter "SCTest.exe" -Recurse |
          Where-Object { $_.Directory.Name -like "*-${{ matrix.config }}" } |
          Select-Object -First 1
        if (-not $scTest) {
          throw "SCTest.exe was not found"
        }

        Copy-Item $openSSLDll $scTest.Directory.FullName
    - name: compile InteropSTL
      shell: cmd
      run: SC.bat build compile InteropSTL ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%
    - name: compile SCStdCppHeaderNoLinkTest
      shell: cmd
      run: SC.bat build compile SCStdCppHeaderNoLinkTest ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%
    - name: test SCTest
      shell: cmd
      run: SC.bat build run SCTest ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS% -- --all-tests
      env:
        SC_CRYPTOGRAPHY_TEST_REQUIRE_OPENSSL: 1
    - name: test InteropSTL
      shell: cmd
      run: SC.bat build run InteropSTL ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%

  auxiliary:
    strategy:
      fail-fast: false
      matrix:
        config: [ Debug, Release ]
        params: [ { os: windows-2022, generator: vs2022 },
                  { os: windows-2025, generator: vs2022 } ]
    runs-on: ${{ matrix.params.os }}
    timeout-minutes: 12
    env:
      SC_ASYNC_EXECUTION_STDEXEC_INCLUDE: _Build/_AsyncExecutionStdexec/include
      SC_ASYNC_EXECUTION_STDEXEC_REVISION: 34fa94719f97f49a553811423fa1200172f22a0e
      WINDOWS_LONG_PATH_ARGS: ${{ matrix.config == 'Debug' && matrix.params.os == 'windows-2022' && '--windows-long-path-aware off' || '' }}

    steps:
    - uses: actions/checkout@v5
    - name: Cache stdexec headers
      id: stdexec-cache
      uses: actions/cache@v5
      with:
        path: _Build/_AsyncExecutionStdexec/include
        key: sc-stdexec-headers-v1-${{ runner.os }}-${{ env.SC_ASYNC_EXECUTION_STDEXEC_REVISION }}
    - name: Download pinned stdexec
      if: steps.stdexec-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v5
      with:
        repository: NVIDIA/stdexec
        ref: ${{ env.SC_ASYNC_EXECUTION_STDEXEC_REVISION }}
        path: _Build/_AsyncExecutionStdexec
        persist-credentials: false
    - name: Generate Single File Libs (Python)
      run: python3 Support/SingleFileLibs/python/amalgamate_single_file_libs.py
    - name: Initialize MSVC environment
      shell: pwsh
      run: ./Support/Scripts/InitializeMsvcEnvironment.ps1
    - name: configure SCSingleFileLibs
      shell: cmd
      run: SC.bat build configure "SCSingleFileLibs:" ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%
    - name: compile SCSingleFileLibs
      shell: cmd
      run: SC.bat build compile "SCSingleFileLibs:" ${{ matrix.config }} ${{ matrix.params.generator }} %WINDOWS_LONG_PATH_ARGS%
    - name: compile SCAsyncExecutionTest
      shell: cmd
      env:
        CL: /Zc:__cplusplus /Zc:preprocessor /external:anglebrackets /external:W0
      run: SC.bat build compile SCAsyncExecutionTest ${{ matrix.config }}
    - name: test SCAsyncExecutionTest
      shell: cmd
      env:
        CL: /Zc:__cplusplus /Zc:preprocessor /external:anglebrackets /external:W0
      run: SC.bat build run SCAsyncExecutionTest ${{ matrix.config }}

  build-fixtures:
    needs: package-warmup
    strategy:
      fail-fast: false
      matrix:
        config: [ Release ]
        params: [ { os: windows-2022, generator: vs2022 },
                  { os: windows-2025, generator: vs2022 } ]
    runs-on: ${{ matrix.params.os }}
    timeout-minutes: 12
    env:
      SC_BUILD_REUSE_MSVC_ENVIRONMENT: '1'
      WINDOWS_LONG_PATH_ARGS: ${{ matrix.config == 'Debug' && matrix.params.os == 'windows-2022' && '--windows-long-path-aware off' || '' }}

    steps:
    - uses: actions/checkout@v5
    - name: Restore LLVM package cache
      id: llvm-cache
      if: matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/llvm
          _Build/_Packages/llvm_*
        key: sc-packages-windows-llvm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-windows-llvm-v4-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-windows-llvm-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-windows-llvm-v2-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux glibc arm64 sysroot cache
      id: linux_sysroot_glibc_arm64_cache
      if: matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-arm64
          _Build/_PackagesCache/linux-sysroot/glibc-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-arm64
          _Build/_Packages/linux-sysroot_glibc_arm64
        key: sc-packages-windows-linux-sysroot-glibc-arm64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-windows-linux-sysroot-glibc-arm64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux musl x86_64 sysroot cache
      id: linux_sysroot_musl_x64_cache
      if: matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-x86_64
          _Build/_PackagesCache/linux-sysroot/musl-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-x86_64
          _Build/_Packages/linux-sysroot_musl_x86_64
        key: sc-packages-windows-linux-sysroot-musl-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-windows-linux-sysroot-musl-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Prune restored LLVM package cache
      if: matrix.config == 'Release'
      shell: bash
      run: ./Support/Scripts/PruneLLVMPackageCache.sh .
    - name: compile SCBuildTest
      shell: cmd
      run: SC.bat build compile SCBuildTest ${{ matrix.config }} ${{ matrix.params.generator }} --libraries unity %WINDOWS_LONG_PATH_ARGS%
      if: matrix.config == 'Release'
    - name: test SCBuildTest
      shell: cmd
      run: SC.bat build run SCBuildTest ${{ matrix.config }} ${{ matrix.params.generator }} --libraries unity %WINDOWS_LONG_PATH_ARGS%
      if: matrix.config == 'Release'

  # Preserve existing matrix check names as gates over all required workload groups.
  build:
    if: always()
    needs: [core, auxiliary, build-fixtures]
    strategy:
      matrix:
        config: [ Debug, Release ]
        params: [ { os: windows-2022, generator: vs2022 },
                  { os: windows-2025, generator: vs2022 } ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check required Windows workloads
      env:
        REQUIRED_RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYCODE'
        import json
        import os
        results = json.loads(os.environ['REQUIRED_RESULTS'])
        for name, job in results.items():
            print(f"{name}: {job['result']}")
        if any(job['result'] != 'success' for job in results.values()):
            raise SystemExit(1)
        PYCODE

  timing-summary:
    runs-on: ubuntu-latest
    needs: [package-warmup, core, auxiliary, build-fixtures, build]
    if: always()

    steps:
    - uses: actions/checkout@v5
    - name: Print CI timing summary
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: python3 Support/Scripts/PrintGitHubActionsTimingSummary.py
