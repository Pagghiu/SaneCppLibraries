name: Posix

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      parallel-tests:
        description: Compare serial and isolated parallel test processes after one build
        type: boolean
        default: false
      profile-compiles:
        description: Replay selected Xcode and Fil-C core compiles with phase diagnostics after tests
        type: boolean
        default: false
      profile-shared-objects:
        description: Compare current Fil-C core/tools object contracts and transfer costs without importing objects
        type: boolean
        default: false
      reuse-shared-objects:
        description: Import verified same-run Fil-C library objects while Core compiles distinct sources
        type: boolean
        default: true
      compare-object-reuse:
        description: Compare four cold Fil-C Core builds on each runner after the normal tests
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 0'

env:
  ASAN_OPTIONS: halt_on_error=1
  UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
  SC_FILC_CI_VERSION: "0.687"

permissions:
  actions: read
  contents: read

jobs:
  core:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        include:
          - config: Debug
            params: { os: ubuntu-24.04 }
          - config: Release
            params: { os: ubuntu-26.04 }
          - config: Debug
            params: { os: macos-latest }
          - config: Release
            params: { os: macos-latest }
    runs-on: ${{ matrix.params.os }}
    timeout-minutes: 20
    env:
      SC_ASYNC_EXECUTION_STDEXEC_INCLUDE: _Build/_AsyncExecutionStdexec/include
      SC_ASYNC_EXECUTION_STDEXEC_REVISION: 34fa94719f97f49a553811423fa1200172f22a0e

    steps:
    - uses: actions/checkout@v5
    - name: Cache stdexec headers
      id: stdexec-cache
      uses: actions/cache@v5
      with:
        path: _Build/_AsyncExecutionStdexec/include
        key: sc-stdexec-headers-v1-${{ runner.os }}-${{ env.SC_ASYNC_EXECUTION_STDEXEC_REVISION }}
    - name: Download pinned stdexec
      if: steps.stdexec-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v5
      with:
        repository: NVIDIA/stdexec
        ref: ${{ env.SC_ASYNC_EXECUTION_STDEXEC_REVISION }}
        path: _Build/_AsyncExecutionStdexec
        persist-credentials: false
    - name: LibC Compatibility Check
      run: ./Support/Scripts/CheckLibC.sh
    - name: Standard C++ Header No Runtime Link Check
      run: ./Support/Scripts/CheckStdCppHeaderNoLink.sh
    - name: Restore llvm-mingw cache
      id: llvm-mingw-cache
      if: matrix.config == 'Release' && matrix.params.os != 'macos-latest'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/llvm-mingw
          _Build/_Packages/llvm-mingw_*
        key: sc-packages-posix-llvm-mingw-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-llvm-mingw-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-llvm-mingw-v2-${{ runner.os }}-${{ runner.arch }}-
    - name: install
      run:  |
        sudo apt-get update
        sudo apt-get install -y liburing-dev openssl
      if: startsWith(matrix.params.os, 'ubuntu-')
    - name: Install compiler cache
      if: matrix.config == 'Release' && startsWith(matrix.params.os, 'ubuntu-')
      run: sudo apt-get install -y --no-install-recommends ccache
    - name: Restore compiler cache
      id: compiler-cache
      if: matrix.config == 'Release' && startsWith(matrix.params.os, 'ubuntu-')
      uses: actions/cache/restore@v5
      with:
        path: _Build/_CompilerCache
        key: sc-compiler-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.params.os }}-${{ matrix.config }}-${{ github.sha }}
        restore-keys: |
          sc-compiler-cache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.params.os }}-${{ matrix.config }}-
    - name: Set up compiler cache
      id: compiler-cache-setup
      if: matrix.config == 'Release' && startsWith(matrix.params.os, 'ubuntu-')
      shell: bash
      run: |
        set -euo pipefail
        export CCACHE_DIR="$GITHUB_WORKSPACE/_Build/_CompilerCache"
        ccache --set-config=compiler_check=content
        ccache --set-config=max_size=256M
        ccache --set-config=compression=true
        ccache --zero-stats
        compiler_wrappers="$GITHUB_WORKSPACE/_Build/_CompilerWrappers"
        mkdir -p "$compiler_wrappers"
        compiler_major="$(gcc -dumpversion | cut -d. -f1)"
        for compiler in cc c++ gcc g++ clang clang++ "gcc-$compiler_major" "g++-$compiler_major"; do
          if command -v "$compiler" >/dev/null 2>&1; then
            ln -sf "$(command -v ccache)" "$compiler_wrappers/$compiler"
          fi
        done
        echo "$compiler_wrappers" >> "$GITHUB_PATH"
        echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
    - name: Check compiler cache invalidation
      if: matrix.config == 'Release' && startsWith(matrix.params.os, 'ubuntu-')
      run: python3 Support/Scripts/CheckCompilerCache.py
    - name: Install OpenSSL 3
      run: |
        HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
        "$(brew --prefix openssl@3)/bin/openssl" version
        test -f "$(brew --prefix openssl@3)/lib/libcrypto.3.dylib"
      if: matrix.params.os == 'macos-latest'
    - name: Generate Single File Libs (Python)
      run: python3 Support/SingleFileLibs/python/amalgamate_single_file_libs.py
    - name: configure SCTest
      run: ./SC.sh build configure SCTest ${{ matrix.config }}
    - name: configure SCSingleFileLibs
      run: ./SC.sh build configure "SCSingleFileLibs:" ${{ matrix.config }}
    - name: compile SCTest
      run: ./SC.sh build compile SCTest ${{ matrix.config }}
      if: matrix.params.os != 'macos-latest' || matrix.config != 'Release'
    - name: compile SCAsyncExecutionTest
      run: ./SC.sh build compile SCAsyncExecutionTest ${{ matrix.config }}
    - name: compile SCBuildTest
      run: ./SC.sh build compile SCBuildTest ${{ matrix.config }}
      if: matrix.config == 'Release' && matrix.params.os != 'macos-latest'
    - name: compile SCSingleFileLibs
      run: ./SC.sh build compile "SCSingleFileLibs:" ${{ matrix.config }}
    - name: compile InteropSTL
      run: ./SC.sh build compile InteropSTL ${{ matrix.config }}
    - name: compile SCStdCppHeaderNoLinkTest
      run: ./SC.sh build compile SCStdCppHeaderNoLinkTest ${{ matrix.config }}
    - name: test Cryptography with ASan and UBSan
      run: |
        ./SC.sh build run SCTest Debug -- --test CryptographyTest
        ./SC.sh build run SCTest Debug -- --test CryptographyOpenSSLTest
        ./SC.sh build run SCTest Debug -- --test CryptographyAsyncStreamsTest
        ./SC.sh build run SCTest Debug -- --test CryptographyTransformStreamsTest
      env:
        CCACHE_DISABLE: 1
        SC_CRYPTOGRAPHY_TEST_REQUIRE_OPENSSL: 1
      if: matrix.config == 'Debug'
    - name: test SCTest
      run: |
        if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.parallel-tests }}" == "true" ]]; then
          python3 Support/Scripts/RunSCTestShards.py --configuration "${{ matrix.config }}" --compare-serial --timings --output _Build/_TestShards/native
        else
          python3 Support/Scripts/RunSCTestShards.py --configuration "${{ matrix.config }}" --output _Build/_TestShards/native
        fi
      env:
        CCACHE_DISABLE: 1
        SC_CRYPTOGRAPHY_TEST_REQUIRE_OPENSSL: 1
      if: matrix.params.os != 'macos-latest' || matrix.config != 'Release'
    - name: test SCAsyncExecutionTest
      env:
        CCACHE_DISABLE: 1
      run: ./SC.sh build run SCAsyncExecutionTest ${{ matrix.config }}
    - name: test SCBuildTest
      env:
        CCACHE_DISABLE: 1
      run: ./SC.sh build run SCBuildTest ${{ matrix.config }}
      if: matrix.config == 'Release' && matrix.params.os != 'macos-latest'
    - name: test InteropSTL
      env:
        CCACHE_DISABLE: 1
      run: ./SC.sh build run InteropSTL ${{ matrix.config }}
    - name: compile SCTest xcode
      run: |
        if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.profile-compiles }}" == "true" ]]; then
          set -o pipefail
          mkdir -p _Build/_CompileProfiles
          ./SC.sh build compile SCTest ${{ matrix.config }} xcode 2>&1 | tee _Build/_CompileProfiles/xcode-build.log
        else
          ./SC.sh build compile SCTest ${{ matrix.config }} xcode
        fi
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
    - name: test SCTest xcode
      run: |
        if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.parallel-tests }}" == "true" ]]; then
          python3 Support/Scripts/RunSCTestShards.py --configuration "${{ matrix.config }}" --generator xcode --compare-serial --timings --output _Build/_TestShards/xcode
        else
          python3 Support/Scripts/RunSCTestShards.py --configuration "${{ matrix.config }}" --generator xcode --output _Build/_TestShards/xcode
        fi
      env:
        CCACHE_DISABLE: 1
        SC_CRYPTOGRAPHY_TEST_REQUIRE_OPENSSL: 1
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
    - name: Profile Xcode core compiler phases
      if: github.event_name == 'workflow_dispatch' && inputs.profile-compiles && matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      run: >-
        python3 Support/Scripts/ProfileCICompiles.py xcode
        --build-log _Build/_CompileProfiles/xcode-build.log
        --intermediate "_Build/_Intermediates/SCTest/macOS-arm64 x86_64-xcode-clang-Release"
        --output _Build/_CompileProfiles/xcode
    - name: Upload Xcode compiler profiles
      if: always() && github.event_name == 'workflow_dispatch' && inputs.profile-compiles && matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      uses: actions/upload-artifact@v6
      with:
        name: compiler-phases-xcode
        path: |
          _Build/_CompileProfiles/xcode
          _Build/_CompileProfiles/xcode-build.log
        retention-days: 7
    - name: Upload test process evidence
      if: always() && (failure() || (github.event_name == 'workflow_dispatch' && inputs.parallel-tests))
      uses: actions/upload-artifact@v6
      with:
        name: test-processes-${{ matrix.params.os }}-${{ matrix.config }}
        path: _Build/_TestShards
        retention-days: 7
    - name: Print macOS crash reports
      if: failure() && matrix.params.os == 'macos-latest'
      shell: bash
      run: bash Support/Scripts/PrintMacOSCrashReports.sh
    - name: Save macOS crash diagnostics
      if: failure() && matrix.params.os == 'macos-latest'
      uses: actions/upload-artifact@v6
      with:
        name: macos-crash-${{ matrix.params.os }}-${{ matrix.config }}-${{ github.run_attempt }}
        if-no-files-found: ignore
        retention-days: 7
        path: |
          ~/Library/Logs/DiagnosticReports/SC*.ips
          ~/Library/Logs/DiagnosticReports/SC*.crash
          _Build/_Outputs/**/SCTest
          _Build/_Outputs/**/SCTest.dSYM/**
          _Build/_Outputs/**/SCAsyncExecutionTest
          _Build/_Outputs/**/SCAsyncExecutionTest.dSYM/**
    - name: Save llvm-mingw cache
      if: matrix.config == 'Release' && matrix.params.os != 'macos-latest' && always() && steps.llvm-mingw-cache.outputs.cache-hit != 'true' && hashFiles('_Build/_PackagesCache/llvm-mingw/**') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/llvm-mingw
          _Build/_Packages/llvm-mingw_*
        key: ${{ steps.llvm-mingw-cache.outputs.cache-primary-key }}
    - name: Compiler cache statistics
      if: always() && steps.compiler-cache-setup.outcome == 'success'
      run: ccache --show-stats --verbose
    - name: Save compiler cache
      if: success() && steps.compiler-cache-setup.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: _Build/_CompilerCache
        key: ${{ steps.compiler-cache.outputs.cache-primary-key }}


  macos-build-fixtures:
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        config: [ Release ]
        params: [ { os: macos-latest } ]
    runs-on: ${{ matrix.params.os }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5
    - name: Restore llvm-mingw cache
      id: llvm-mingw-cache
      if: matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/llvm-mingw
          _Build/_Packages/llvm-mingw_*
        key: sc-packages-posix-llvm-mingw-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-llvm-mingw-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-llvm-mingw-v2-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore LLVM package cache
      id: llvm-cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/llvm
          _Build/_Packages/llvm_*
        key: sc-packages-posix-llvm-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-llvm-v4-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-llvm-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-llvm-v2-${{ runner.os }}-${{ runner.arch }}-
    - name: Prune restored LLVM package cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      run: ./Support/Scripts/PruneLLVMPackageCache.sh .
    - name: Restore Linux glibc x86_64 sysroot cache
      id: linux_sysroot_glibc_x64_cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-x86_64
          _Build/_PackagesCache/linux-sysroot/glibc-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-x86_64
          _Build/_Packages/linux-sysroot_glibc_x86_64
        key: sc-packages-posix-linux-sysroot-glibc-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-linux-sysroot-glibc-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux glibc arm64 sysroot cache
      id: linux_sysroot_glibc_arm64_cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-arm64
          _Build/_PackagesCache/linux-sysroot/glibc-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-arm64
          _Build/_Packages/linux-sysroot_glibc_arm64
        key: sc-packages-posix-linux-sysroot-glibc-arm64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-linux-sysroot-glibc-arm64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux musl x86_64 sysroot cache
      id: linux_sysroot_musl_x64_cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-x86_64
          _Build/_PackagesCache/linux-sysroot/musl-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-x86_64
          _Build/_Packages/linux-sysroot_musl_x86_64
        key: sc-packages-posix-linux-sysroot-musl-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-linux-sysroot-musl-x86_64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Linux musl arm64 sysroot cache
      id: linux_sysroot_musl_arm64_cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-arm64
          _Build/_PackagesCache/linux-sysroot/musl-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-arm64
          _Build/_Packages/linux-sysroot_musl_arm64
        key: sc-packages-posix-linux-sysroot-musl-arm64-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-linux-sysroot-musl-arm64-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore legacy Linux sysroot cache
      id: linux_sysroot_legacy_cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && (steps.linux_sysroot_glibc_x64_cache.outputs.cache-hit != 'true' || steps.linux_sysroot_glibc_arm64_cache.outputs.cache-hit != 'true' || steps.linux_sysroot_musl_x64_cache.outputs.cache-hit != 'true' || steps.linux_sysroot_musl_arm64_cache.outputs.cache-hit != 'true')
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot
          _Build/_Packages/linux-sysroot_*
        key: sc-packages-posix-linux-sysroot-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt') }}
        restore-keys: |
          sc-packages-posix-linux-sysroot-v2-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-linux-sysroot-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Probe QEMU user runners
      id: qemu-user-runners
      shell: bash
      run: |
        if { command -v qemu-x86_64 || command -v qemu-x86_64-static; } >/dev/null 2>&1 && { command -v qemu-aarch64 || command -v qemu-aarch64-static; } >/dev/null 2>&1; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
    - name: Check restored macOS cross packages
      id: macos-cross-packages
      shell: bash
      run: |
        set -euo pipefail

        case "${{ runner.arch }}" in
          ARM64) host_arch="arm64" ;;
          X64) host_arch="x86_64" ;;
          *) host_arch="$(printf '%s' "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')" ;;
        esac

        llvm_root="_Build/_Packages/llvm_macos_${host_arch}"
        if [[ -f "${llvm_root}/sc-package-receipt.json" && -x "${llvm_root}/bin/clang" ]]; then
          echo "llvm-installed=true" >> "$GITHUB_OUTPUT"
          echo "LLVM install root restored: ${llvm_root}"
        else
          echo "llvm-installed=false" >> "$GITHUB_OUTPUT"
          echo "LLVM install root missing: ${llvm_root}"
        fi

        sysroot_missing=0
        for sysroot in \
          _Build/_Packages/linux-sysroot_glibc_x86_64 \
          _Build/_Packages/linux-sysroot_glibc_arm64 \
          _Build/_Packages/linux-sysroot_musl_x86_64 \
          _Build/_Packages/linux-sysroot_musl_arm64
        do
          if [[ ! -f "${sysroot}/sc-package-receipt.json" ]]; then
            echo "Linux sysroot install root missing: ${sysroot}"
            sysroot_missing=1
          fi
        done

        if [[ "${sysroot_missing}" == 0 ]]; then
          echo "linux-sysroots-installed=true" >> "$GITHUB_OUTPUT"
          echo "Linux sysroot install roots restored"
        else
          echo "linux-sysroots-installed=false" >> "$GITHUB_OUTPUT"
        fi
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
    - name: Warm macOS LLVM package
      run: |
        ./SC.sh package install llvm
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && steps.macos-cross-packages.outputs.llvm-installed != 'true'
    - name: Warm macOS Linux sysroot packages
      run: |
        ./SC.sh package install linux-sysroot-glibc-x86_64
        ./SC.sh package install linux-sysroot-glibc-arm64
        ./SC.sh package install linux-sysroot-musl-x86_64
        ./SC.sh package install linux-sysroot-musl-arm64
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && steps.macos-cross-packages.outputs.linux-sysroots-installed != 'true'
    - name: Verify macOS cross package receipts
      run: |
        ./SC.sh package verify llvm
        ./SC.sh package verify linux-sysroot-glibc-x86_64
        ./SC.sh package verify linux-sysroot-glibc-arm64
        ./SC.sh package verify linux-sysroot-musl-x86_64
        ./SC.sh package verify linux-sysroot-musl-arm64
        ./SC.sh package lock
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release'
    - name: compile SCBuildTest
      run: ./SC.sh build compile SCBuildTest ${{ matrix.config }}
      if: matrix.config == 'Release'
    - name: test SCBuildTest
      env:
        CCACHE_DISABLE: 1
      run: ./SC.sh build run SCBuildTest ${{ matrix.config }}
      if: matrix.config == 'Release'
    - name: test SCBuildTest real QEMU Linux target profiles
      run: ./SC.sh build run SCBuildTest ${{ matrix.config }} -- --test SCBuildTest --test-section "native backend smoke-runs Linux target profiles through real qemu on macOS"
      env:
        CCACHE_DISABLE: 1
        SC_BUILD_REQUIRE_REAL_QEMU: 1
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && steps.qemu-user-runners.outputs.available == 'true'
    - name: Print macOS crash reports
      if: failure() && matrix.params.os == 'macos-latest'
      shell: bash
      run: bash Support/Scripts/PrintMacOSCrashReports.sh
    - name: Save macOS crash diagnostics
      if: failure() && matrix.params.os == 'macos-latest'
      uses: actions/upload-artifact@v6
      with:
        name: macos-fixtures-crash-${{ matrix.params.os }}-${{ matrix.config }}-${{ github.run_attempt }}
        if-no-files-found: ignore
        retention-days: 7
        path: |
          ~/Library/Logs/DiagnosticReports/SC*.ips
          ~/Library/Logs/DiagnosticReports/SC*.crash
          _Build/_Outputs/**/SCBuildTest
          _Build/_Outputs/**/SCBuildTest.dSYM/**
    - name: Save llvm-mingw cache
      if: matrix.config == 'Release' && always() && steps.llvm-mingw-cache.outputs.cache-hit != 'true' && hashFiles('_Build/_PackagesCache/llvm-mingw/**') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/llvm-mingw
          _Build/_Packages/llvm-mingw_*
        key: ${{ steps.llvm-mingw-cache.outputs.cache-primary-key }}
    - name: Save LLVM package cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && always() && steps.llvm-cache.outputs.cache-hit != 'true' && hashFiles('_Build/_PackagesCache/llvm/**') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/llvm
          _Build/_Packages/llvm_*
        key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
    - name: Save Linux glibc x86_64 sysroot cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && always() && steps.linux_sysroot_glibc_x64_cache.outputs.cache-hit != 'true' && hashFiles('_Build/_Packages/linux-sysroot_glibc_x86_64/sc-package-receipt.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-x86_64
          _Build/_PackagesCache/linux-sysroot/glibc-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-x86_64
          _Build/_Packages/linux-sysroot_glibc_x86_64
        key: ${{ steps.linux_sysroot_glibc_x64_cache.outputs.cache-primary-key }}
    - name: Save Linux glibc arm64 sysroot cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && always() && steps.linux_sysroot_glibc_arm64_cache.outputs.cache-hit != 'true' && hashFiles('_Build/_Packages/linux-sysroot_glibc_arm64/sc-package-receipt.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/glibc-arm64
          _Build/_PackagesCache/linux-sysroot/glibc-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/glibc-arm64
          _Build/_Packages/linux-sysroot_glibc_arm64
        key: ${{ steps.linux_sysroot_glibc_arm64_cache.outputs.cache-primary-key }}
    - name: Save Linux musl x86_64 sysroot cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && always() && steps.linux_sysroot_musl_x64_cache.outputs.cache-hit != 'true' && hashFiles('_Build/_Packages/linux-sysroot_musl_x86_64/sc-package-receipt.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-x86_64
          _Build/_PackagesCache/linux-sysroot/musl-x86_64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-x86_64
          _Build/_Packages/linux-sysroot_musl_x86_64
        key: ${{ steps.linux_sysroot_musl_x64_cache.outputs.cache-primary-key }}
    - name: Save Linux musl arm64 sysroot cache
      if: matrix.params.os == 'macos-latest' && matrix.config == 'Release' && always() && steps.linux_sysroot_musl_arm64_cache.outputs.cache-hit != 'true' && hashFiles('_Build/_Packages/linux-sysroot_musl_arm64/sc-package-receipt.json') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/linux-sysroot/musl-arm64
          _Build/_PackagesCache/linux-sysroot/musl-arm64.txt
          _Build/_PackagesCache/linux-sysroot/downloads/musl-arm64
          _Build/_Packages/linux-sysroot_musl_arm64
        key: ${{ steps.linux_sysroot_musl_arm64_cache.outputs.cache-primary-key }}
    # - name: install gdb
    #   run: sudo apt install -y gdb
    # - name: test in gdb
    #   run: gdb --batch -ex "run" -ex "quit" --args _Build/_Outputs/linux-x86_64-make-gcc-Debug/SCTest
    # - name: test in lldb
    #   run: lldb -o "run" -o "quit" -- _Build/_Outputs/macOS-x86_64-make-clang-Debug/SCTest

  # Preserve the original required check names over both workload groups.
  build:
    if: always() && github.event_name != 'schedule'
    needs: [core, macos-build-fixtures]
    strategy:
      matrix:
        include:
          - config: Debug
            params: { os: ubuntu-24.04 }
          - config: Release
            params: { os: ubuntu-26.04 }
          - config: Debug
            params: { os: macos-latest }
          - config: Release
            params: { os: macos-latest }
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Check required Posix workloads
      env:
        REQUIRED_RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYCODE'
        import json
        import os
        results = json.loads(os.environ['REQUIRED_RESULTS'])
        for name, job in results.items():
            print(f"{name}: {job['result']}")
        if any(job['result'] != 'success' for job in results.values()):
            raise SystemExit(1)
        PYCODE

  filc-package-warmup:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - name: Look up exact Fil-C cache
      id: exact-0
      uses: actions/cache/restore@v5
      with:
        lookup-only: true
        path: |
          _Build/_PackagesCache/filc
          _Build/_Packages/filc_*
        key: sc-packages-posix-filc-v4-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package.cpp', 'Tools/SC-package.h', 'Tools/SC-package/BuiltinInstallers.inl', 'Support/Scripts/PruneFilCPackageCache.py') }}
    - name: Look up exact zlib-filc source cache
      id: exact-1
      uses: actions/cache/restore@v5
      with:
        lookup-only: true
        path: |
          _Build/_PackagesCache/zlib-filc
        key: sc-packages-posix-zlib-filc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package.cpp', 'Tools/SC-package.h', 'Tools/SC-package/BuiltinInstallers.inl') }}
    - name: Look up exact curl-filc package cache
      id: exact-2
      uses: actions/cache/restore@v5
      with:
        lookup-only: true
        path: |
          _Build/_PackagesCache/curl-filc
          _Build/_Packages/curl_filc
        key: sc-packages-posix-curl-filc-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package/BuiltinInstallers.inl', 'Tools/SC-package/FilCRuntimeDependencies.inl', 'Tools/Support/FilCOpenSSL365.patch', 'Tools/Support/CurlFilCSmoke.c') }}
    - name: Look up exact Fil-C TLS package cache
      id: exact-3
      uses: actions/cache/restore@v5
      with:
        lookup-only: true
        path: |
          _Build/_PackagesCache/openssl-filc
          _Build/_PackagesCache/nghttp2-filc
          _Build/_Packages/openssl_filc
          _Build/_Packages/nghttp2_filc
        key: sc-packages-posix-filc-tls-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package/BuiltinInstallers.inl', 'Tools/SC-package/FilCRuntimeDependencies.inl', 'Tools/Support/FilCOpenSSL365.patch', 'Tools/Support/OpenSSLFilCSmoke.c', 'Tools/Support/NGHTTP2FilCSmoke.c') }}
    - name: Decide whether packages need preparation
      id: prepare
      env:
        HIT_0: ${{ steps.exact-0.outputs.cache-hit }}
        HIT_1: ${{ steps.exact-1.outputs.cache-hit }}
        HIT_2: ${{ steps.exact-2.outputs.cache-hit }}
        HIT_3: ${{ steps.exact-3.outputs.cache-hit }}
      run: |
        if [[ "$HIT_0" == true && "$HIT_1" == true && "$HIT_2" == true && "$HIT_3" == true ]]; then
          echo "required=false" >> "$GITHUB_OUTPUT"
        else
          echo "required=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore Fil-C cache
      if: steps.prepare.outputs.required == 'true'
      id: filc-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/filc
          _Build/_Packages/filc_*
        key: sc-packages-posix-filc-v4-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package.cpp', 'Tools/SC-package.h', 'Tools/SC-package/BuiltinInstallers.inl', 'Support/Scripts/PruneFilCPackageCache.py') }}
        restore-keys: |
          sc-packages-posix-filc-v4-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore zlib-filc source cache
      if: steps.prepare.outputs.required == 'true'
      id: zlib-filc-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/zlib-filc
        key: sc-packages-posix-zlib-filc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package.cpp', 'Tools/SC-package.h', 'Tools/SC-package/BuiltinInstallers.inl') }}
        restore-keys: |
          sc-packages-posix-zlib-filc-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore curl-filc package cache
      if: steps.prepare.outputs.required == 'true'
      id: curl-filc-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/curl-filc
          _Build/_Packages/curl_filc
        key: sc-packages-posix-curl-filc-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package/BuiltinInstallers.inl', 'Tools/SC-package/FilCRuntimeDependencies.inl', 'Tools/Support/FilCOpenSSL365.patch', 'Tools/Support/CurlFilCSmoke.c') }}
        restore-keys: |
          sc-packages-posix-curl-filc-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-curl-filc-v2-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-curl-filc-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Fil-C TLS package cache
      if: steps.prepare.outputs.required == 'true'
      id: filc-tls-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/openssl-filc
          _Build/_PackagesCache/nghttp2-filc
          _Build/_Packages/openssl_filc
          _Build/_Packages/nghttp2_filc
        key: sc-packages-posix-filc-tls-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package/BuiltinInstallers.inl', 'Tools/SC-package/FilCRuntimeDependencies.inl', 'Tools/Support/FilCOpenSSL365.patch', 'Tools/Support/OpenSSLFilCSmoke.c', 'Tools/Support/NGHTTP2FilCSmoke.c') }}
        restore-keys: |
          sc-packages-posix-filc-tls-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-tls-v2-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-tls-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: install Fil-C
      if: steps.prepare.outputs.required == 'true'
      run: ./Support/Scripts/SetupFilCCICompiler.sh "$SC_FILC_CI_VERSION"
    - name: verify Fil-C package receipt
      if: steps.prepare.outputs.required == 'true'
      run: ./SC.sh package verify filc
    - name: Prune obsolete Fil-C compiler cache copies
      if: steps.prepare.outputs.required == 'true'
      run: |
        python3 Support/Scripts/PruneFilCPackageCache.py --architecture "$(uname -m)"
        ./SC.sh package install filc
        ./SC.sh package verify filc
    - name: Save Fil-C cache
      if: success() && steps.prepare.outputs.required == 'true' && steps.filc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/filc
          _Build/_Packages/filc_*
        key: ${{ steps.filc-cache.outputs.cache-primary-key }}
    - name: Prepare and verify Fil-C runtime packages
      if: steps.prepare.outputs.required == 'true'
      id: filc-runtime-packages
      run: |
        ./SC.sh package install curl-filc
        ./SC.sh package verify zlib-filc
        ./SC.sh package verify openssl-filc
        ./SC.sh package verify nghttp2-filc
        ./SC.sh package verify curl-filc
    - name: Save zlib-filc source cache
      if: success() && steps.prepare.outputs.required == 'true' && steps.filc-runtime-packages.outcome == 'success' && steps.zlib-filc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/zlib-filc
        key: ${{ steps.zlib-filc-cache.outputs.cache-primary-key }}
    - name: Save curl-filc package cache
      if: success() && steps.prepare.outputs.required == 'true' && steps.filc-runtime-packages.outcome == 'success' && steps.curl-filc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/curl-filc
          _Build/_Packages/curl_filc
        key: ${{ steps.curl-filc-cache.outputs.cache-primary-key }}
    - name: Save Fil-C TLS package cache
      if: success() && steps.prepare.outputs.required == 'true' && steps.filc-runtime-packages.outcome == 'success' && steps.filc-tls-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/openssl-filc
          _Build/_PackagesCache/nghttp2-filc
          _Build/_Packages/openssl_filc
          _Build/_Packages/nghttp2_filc
        key: ${{ steps.filc-tls-cache.outputs.cache-primary-key }}

  filc-linux-workloads:
    needs: [filc-package-warmup]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04-arm]
        partition: [core, tools]
        include:
        - partition: core
          project: SCTestCore
        - partition: tools
          project: SCTestTools
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    env:
      SC_PROFILE_SHARED_OBJECTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.profile-shared-objects || inputs.reuse-shared-objects || inputs.compare-object-reuse) && '1' || '0' }}
      SC_REUSE_SHARED_OBJECTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.reuse-shared-objects || inputs.compare-object-reuse) && '1' || '0' }}
      SC_COMPARE_SHARED_OBJECTS: ${{ github.event_name == 'workflow_dispatch' && inputs.compare-object-reuse && '1' || '0' }}

    steps:
    - uses: actions/checkout@v5
    - name: Restore Fil-C cache
      id: filc-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/filc
          _Build/_Packages/filc_*
        key: sc-packages-posix-filc-v4-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package.cpp', 'Tools/SC-package.h', 'Tools/SC-package/BuiltinInstallers.inl', 'Support/Scripts/PruneFilCPackageCache.py') }}
        restore-keys: |
          sc-packages-posix-filc-v4-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-v3-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-${{ runner.os }}-${{ runner.arch }}-
    - name: install Fil-C
      run: ./Support/Scripts/SetupFilCCICompiler.sh "$SC_FILC_CI_VERSION"
    - name: verify Fil-C package receipt
      run: ./SC.sh package verify filc
    - name: compile ${{ matrix.project }} Release with Fil-C
      run: |
        if [ "$SC_REUSE_SHARED_OBJECTS" = 1 ] && [ "${{ matrix.partition }}" = core ]; then
          ./SC.sh build compile-objects SCTestCore Release native --toolchain filc --exclude-sources 'Libraries/*' --verbose
        else
          ./SC.sh build compile ${{ matrix.project }} Release native --toolchain filc --verbose
        fi
    - name: Profile Fil-C common object inputs
      if: env.SC_PROFILE_SHARED_OBJECTS == '1'
      run: >-
        python3 Support/Scripts/ProfileFilCObjectSharing.py collect
        --intermediate "_Build/_Intermediates/${{ matrix.project }}/linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}-Native-filc-Release"
        --output "_Build/_ObjectProfiles/${{ matrix.partition }}"
        ${{ matrix.partition == 'tools' && '--bundle' || '' }}
    - name: Publish Fil-C common object diagnostic bundle
      if: matrix.partition == 'tools' && env.SC_PROFILE_SHARED_OBJECTS == '1'
      uses: actions/upload-artifact@v6
      with:
        name: filc-common-objects-${{ runner.arch }}-${{ github.run_attempt }}
        path: _Build/_ObjectProfiles/tools/objects.zip
        compression-level: 0
        retention-days: 1
        if-no-files-found: error
    - name: Wait for matching Fil-C producer artifact
      if: matrix.partition == 'core' && env.SC_PROFILE_SHARED_OBJECTS == '1'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        python3 Support/Scripts/ProfileFilCObjectSharing.py wait-artifact
        --name "filc-common-objects-${{ runner.arch }}-${{ github.run_attempt }}"
        --output _Build/_ObjectProfiles/core/artifact-ready.json
    - name: Download Fil-C common object diagnostic bundle
      if: matrix.partition == 'core' && env.SC_PROFILE_SHARED_OBJECTS == '1'
      uses: actions/download-artifact@v6
      with:
        name: filc-common-objects-${{ runner.arch }}-${{ github.run_attempt }}
        path: _Build/_ObjectProfiles/producer
    - name: Compare current Fil-C object contracts
      if: matrix.partition == 'core' && env.SC_PROFILE_SHARED_OBJECTS == '1'
      run: >-
        python3 Support/Scripts/ProfileFilCObjectSharing.py compare
        --local _Build/_ObjectProfiles/core
        --bundle _Build/_ObjectProfiles/producer/objects.zip
        --output _Build/_ObjectProfiles/core/compatibility.json
    - name: Stage and import verified Fil-C objects
      if: matrix.partition == 'core' && env.SC_REUSE_SHARED_OBJECTS == '1'
      run: |
        python3 Support/Scripts/ProfileFilCObjectSharing.py stage \
          --local _Build/_ObjectProfiles/core \
          --bundle _Build/_ObjectProfiles/producer/objects.zip \
          --intermediate "_Build/_Intermediates/SCTestCore/linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}-Native-filc-Release" \
          --output _Build/_ObjectProfiles/core/import-stage
        ./SC.sh build import-objects SCTestCore Release native --toolchain filc --manifest _Build/_ObjectProfiles/core/import-stage/import.txt
    - name: Link imported Fil-C Core with normal dependency and export checks
      if: matrix.partition == 'core' && env.SC_REUSE_SHARED_OBJECTS == '1'
      run: |
        ./SC.sh build compile SCTestCore Release native --toolchain filc --verbose | tee _Build/_ObjectProfiles/core/import-link.log
        python3 Support/Scripts/ProfileFilCObjectSharing.py verify-link \
          --intermediate "_Build/_Intermediates/SCTestCore/linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}-Native-filc-Release" \
          --log _Build/_ObjectProfiles/core/import-link.log \
          --output _Build/_ObjectProfiles/core/import-link-proof.json
    - name: Upload Fil-C object sharing evidence
      if: always() && matrix.partition == 'core' && env.SC_PROFILE_SHARED_OBJECTS == '1'
      uses: actions/upload-artifact@v6
      with:
        name: filc-object-sharing-${{ runner.arch }}-${{ github.run_attempt }}
        path: _Build/_ObjectProfiles/core
        retention-days: 7
    - name: Restore zlib-filc source cache
      id: zlib-filc-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/zlib-filc
        key: sc-packages-posix-zlib-filc-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package.cpp', 'Tools/SC-package.h', 'Tools/SC-package/BuiltinInstallers.inl') }}
        restore-keys: |
          sc-packages-posix-zlib-filc-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore curl-filc package cache
      id: curl-filc-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/curl-filc
          _Build/_Packages/curl_filc
        key: sc-packages-posix-curl-filc-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package/BuiltinInstallers.inl', 'Tools/SC-package/FilCRuntimeDependencies.inl', 'Tools/Support/FilCOpenSSL365.patch', 'Tools/Support/CurlFilCSmoke.c') }}
        restore-keys: |
          sc-packages-posix-curl-filc-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-curl-filc-v2-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-curl-filc-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore Fil-C TLS package cache
      id: filc-tls-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          _Build/_PackagesCache/openssl-filc
          _Build/_PackagesCache/nghttp2-filc
          _Build/_Packages/openssl_filc
          _Build/_Packages/nghttp2_filc
        key: sc-packages-posix-filc-tls-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tools/SC-package-versions.txt', 'Tools/SC-package/BuiltinInstallers.inl', 'Tools/SC-package/FilCRuntimeDependencies.inl', 'Tools/Support/FilCOpenSSL365.patch', 'Tools/Support/OpenSSLFilCSmoke.c', 'Tools/Support/NGHTTP2FilCSmoke.c') }}
        restore-keys: |
          sc-packages-posix-filc-tls-v3-${{ env.SC_FILC_CI_VERSION }}-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-tls-v2-${{ runner.os }}-${{ runner.arch }}-
          sc-packages-posix-filc-tls-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Prepare and verify Fil-C runtime packages
      id: filc-runtime-packages
      run: |
        ./SC.sh package install curl-filc
        ./SC.sh package verify zlib-filc
        ./SC.sh package verify openssl-filc
        ./SC.sh package verify nghttp2-filc
        ./SC.sh package verify curl-filc
    - name: test SCTest Release with Fil-C
      if: matrix.partition == 'core'
      env:
        SC_FILC_TEST_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.parallel-tests && '1' || '2' }}
      run: SC_FILC_TEST_PROJECT=SCTestCore ./Support/Scripts/RunFilCTLSFixture.sh Release --all-tests
    - name: test SCTestTools Release with Fil-C
      if: matrix.partition == 'tools'
      run: ./SC.sh build run SCTestTools Release native --toolchain filc -- --all-tests
    - name: Upload Fil-C test process evidence
      if: always() && matrix.partition == 'core' && (failure() || (github.event_name == 'workflow_dispatch' && inputs.parallel-tests))
      uses: actions/upload-artifact@v6
      with:
        name: test-processes-filc-${{ runner.arch }}
        path: _Build/_FilCTLSFixture/run.*/test-shards
        retention-days: 7
    - name: Save zlib-filc source cache
      if: always() && steps.zlib-filc-cache.outputs.cache-hit != 'true' && hashFiles('_Build/_PackagesCache/zlib-filc/**') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/zlib-filc
        key: ${{ steps.zlib-filc-cache.outputs.cache-primary-key }}
    - name: Save curl-filc package cache
      if: always() && steps.filc-runtime-packages.outcome == 'success' && steps.curl-filc-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/curl-filc
          _Build/_Packages/curl_filc
        key: ${{ steps.curl-filc-cache.outputs.cache-primary-key }}
    - name: Save Fil-C TLS package cache
      if: always() && steps.filc-runtime-packages.outcome == 'success' && steps.filc-tls-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/openssl-filc
          _Build/_PackagesCache/nghttp2-filc
          _Build/_Packages/openssl_filc
          _Build/_Packages/nghttp2_filc
        key: ${{ steps.filc-tls-cache.outputs.cache-primary-key }}
    - name: Save Fil-C cache
      if: always() && steps.filc-cache.outputs.cache-hit != 'true' && hashFiles('_Build/_PackagesCache/filc/**') != ''
      uses: actions/cache/save@v5
      with:
        path: |
          _Build/_PackagesCache/filc
          _Build/_Packages/filc_*
        key: ${{ steps.filc-cache.outputs.cache-primary-key }}

    - name: Validate C++20 coroutine shim with Fil-C
      if: matrix.partition == 'core'
      run: |
        ./SC.sh build compile SCAwaitCoroutineShimTest Release native --toolchain filc
        ./SC.sh build run SCAwaitCoroutineShimTest Release native --toolchain filc

    - name: Compare cold Fil-C object reuse on this runner
      if: matrix.partition == 'core' && env.SC_COMPARE_SHARED_OBJECTS == '1'
      run: >-
        python3 Support/Scripts/BenchmarkFilCObjectSharing.py
        --intermediate "_Build/_Intermediates/SCTestCore/linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}-Native-filc-Release"
        --bundle _Build/_ObjectProfiles/producer/objects.zip
        --output _Build/_ObjectBenchmarks
    - name: Upload matched Fil-C object reuse measurements
      if: always() && matrix.partition == 'core' && env.SC_COMPARE_SHARED_OBJECTS == '1'
      uses: actions/upload-artifact@v6
      with:
        name: filc-object-benchmark-${{ runner.arch }}-${{ github.run_attempt }}
        path: |
          _Build/_ObjectBenchmarks/results.json
          _Build/_ObjectBenchmarks/*/*.log
          _Build/_ObjectBenchmarks/*/link-proof.json
        retention-days: 7
    - name: Profile Fil-C core compiler phases
      if: github.event_name == 'workflow_dispatch' && inputs.profile-compiles && matrix.partition == 'core'
      run: >-
        python3 Support/Scripts/ProfileCICompiles.py filc
        --intermediate "_Build/_Intermediates/SCTestCore/linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}-Native-filc-Release"
        --output _Build/_CompileProfiles/filc
    - name: Upload Fil-C compiler profiles
      if: always() && github.event_name == 'workflow_dispatch' && inputs.profile-compiles && matrix.partition == 'core'
      uses: actions/upload-artifact@v6
      with:
        name: compiler-phases-filc-${{ runner.arch }}
        path: _Build/_CompileProfiles/filc
        retention-days: 7

  filc-linux-experimental:
    needs: [filc-linux-workloads]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check required Fil-C workloads
      env:
        WORKLOAD_RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYTHON'
        import json, os
        results = json.loads(os.environ['WORKLOAD_RESULTS'])
        if any(job['result'] != 'success' for job in results.values()):
            raise SystemExit('A required Fil-C workload did not succeed')
        PYTHON

  timing-summary:
    runs-on: ubuntu-latest
    needs: [build, filc-linux-experimental]
    if: always()

    steps:
    - uses: actions/checkout@v5
    - name: Print CI timing summary
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
      run: python3 Support/Scripts/PrintGitHubActionsTimingSummary.py
